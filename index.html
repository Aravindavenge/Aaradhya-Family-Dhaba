<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaradhya Family Dhaba</title>

    <link 
      rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" 
    />
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="main">

        <div class="navbar">
            <div class="nav-1">
                <div class="logo">Aaradhya Family Dhaba</div>

                <ul class="links">
                    <li>Home</li>
                    <li>Menu</li>
                    <li>About</li>
                    <li>Location</li>
                    <li>Contact</li>
                </ul>

                <div class="icons">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>
        </div>

        <div class="hero">
            <div class="left">
                <span class="left1">Are You Hungry?</span>
                <span class="left2">Don't Wait</span>
                <span class="left3">Let's Start to order food now</span>
                <span class="left4">Check out Menu</span>
            </div>

            <div class="food" id="food"></div>
        </div>

        <div class="items">
            <div id="food1"></div>
            <div id="food2"></div>
            <div id="food3"></div>
            <div id="food4"></div>
        </div>

    </div>

    <script>
        let food = document.getElementById("food")

        document.getElementById("food1").onclick = () => {
            food.style.backgroundImage = "url('./food1.png')"
        }
        document.getElementById("food2").onclick = () => {
            food.style.backgroundImage = "url('./food2.png')"
        }
        document.getElementById("food3").onclick = () => {
            food.style.backgroundImage = "url('./food3.png')"
        }
        document.getElementById("food4").onclick = () => {
            food.style.backgroundImage = "url('./food4.png')"
        }
    </script>

</body>
</html>
